# {ticket_id} and {escalation_threshold} are interpolated from the inputs dict passed
# to kickoff() — see adapters/crewai_pipeline/pipeline.py. Do not hardcode the
# threshold here: it lives in domain/policy.py, which also feeds the console gauge and
# the severity floor in the frustration_score field description.
triage_task:
  description: >
    Retrieve the information for the ticket key {ticket_id} using your ticket fetcher tool. Analyze the retrieved contents for categorical context, customer tone, and sentiment.
    Score the customer's frustration strictly against the calibration tiers defined in the frustration_score field of your output schema, including its severity floor. Do not score on instinct, and do not drift upward: most routine tickets belong in the 1-6 range.
    Fill score_rationale with a short justification that quotes the phrase from the ticket which drove the score.
  expected_output: >
    A verified structured data schema containing ticket classifications, a frustration score calibrated against the tiers in the schema, and the quoted rationale for that score.
  agent: triage_agent

resolution_task:
  description: >
    Review the triage analysis completed for ticket {ticket_id}.
    Copy frustration_score and score_rationale from the triage analysis verbatim into your output. You are not the scorer: never recompute, round, or adjust that number, even if you disagree with it.
    Check the assigned frustration_score:
    - If the frustration_score is {escalation_threshold} or higher, immediately set resolution_status to exactly 'escalated_to_human' and compose detailed internal technical summary hand-off notes.
    - If the frustration_score is lower than {escalation_threshold}, set resolution_status to exactly 'resolved_draft' and resolve the ticket by drafting a comprehensive, friendly step-by-step resolution email template.
    The resolution_status field accepts only these two values, spelled exactly as shown. Never substitute a synonym such as 'resolved', 'drafted', or 'escalated'.
  expected_output: >
    A validated resolution schema indicating whether the ticket was successfully drafted or escalated, alongside the respective message payload.
  agent: technical_resolver
  context:
    - triage_task
