[project]
name = "customer_support_crew"
version = "0.1.0"
description = "customer-support-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.193.0,<1.0.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "jira>=3.10.5",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
customer_support_crew = "customer_support_crew.main:run"
run_crew = "customer_support_crew.main:run"
serve = "customer_support_crew.api.app:main"
# `train`, `replay` and `test` used to be declared here pointing at main:train /
# main:replay / main:test, none of which have ever existed. Removed rather than
# stubbed: `crewai train|replay|test` shells out to them and would fail either way.

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
